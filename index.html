<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031326">
  <meta property="og:type" content="website">
<meta property="og:title" content="Stage Fright">
  <meta property="og:description" content="A spooky co-op adventure where friends solve puzzles, explore eerie worlds, and face strange creatures together.">
  <meta property="og:url" content="https://whyjajs-art.github.io/stage-fright/">
  <meta property="og:image" content="https://whyjajs-art.github.io/stage-fright/assets/stage-fright-share.jpg">
  <meta property="og:image:secure_url" content="https://whyjajs-art.github.io/stage-fright/assets/stage-fright-share.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="616">
  <meta property="og:image:height" content="353">
  <meta property="og:image:alt" content="Stage Fright">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Stage Fright">
  <meta name="twitter:description" content="A spooky co-op adventure where friends solve puzzles, explore eerie worlds, and face strange creatures together.">
  <meta name="twitter:image" content="https://whyjajs-art.github.io/stage-fright/assets/stage-fright-share.jpg">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/stage-fright-wordmark-favicon.png">
  <link rel="apple-touch-icon" href="assets/stage-fright-wordmark-favicon.png">
  <meta name="description" content="A spooky co-op adventure where friends solve puzzles, explore eerie worlds, and face strange creatures together.">
  <title>Stage Fright</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sections.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#home" aria-label="Stage Fright Home">
        <img src="assets/logo.png" alt="Stage Fright">
      </a>

      <nav aria-label="Main navigation">
        <a href="#home">ABOUT</a>
        <a href="#previews">PREVIEWS</a>
        <a href="#trailer">TRAILER</a>
      </nav>

      <div class="top-actions">
        <a class="button steam" href="https://store.steampowered.com/app/3260750/Stage_Fright/" target="_blank" rel="noopener noreferrer">
          <img class="steam-icon" src="assets/steam-icon.png" alt="">WISHLIST ON STEAM
        </a>
        <a class="button outline small" href="#trailer">▶ &nbsp; WATCH TRAILER</a>
      </div>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <img class="hero-bg" src="assets/hero.jpg" alt="" aria-hidden="true">
      <div class="hero-shade"></div>

      <div class="hero-main">
        <img class="hero-logo" src="assets/logo-hero.png" alt="Stage Fright">
        <div class="hero-actions">
          <a id="download" class="button download" href="downloads/StageFright.zip" download>DOWNLOAD</a>
          <a class="button outline" href="#trailer">▶ &nbsp; WATCH TRAILER</a>
        </div>
      </div>

      <a class="down" href="#previews" aria-label="Scroll to gameplay"><span></span></a>
    </section>

    <section class="continuation">
      <section id="previews" class="previews">
        <div class="gameplay-side-art gameplay-side-left" aria-hidden="true"></div>
        <div class="gameplay-side-art gameplay-side-right" aria-hidden="true"></div>

        <div class="chip">GAMEPLAY</div>
        <h1>IN-GAME MOMENTS</h1>
        <div class="accent"></div>

        <div class="gallery-frame">
          <div class="gallery-frame-line gallery-frame-line-top" aria-hidden="true"></div>
          <div class="gallery">
            <button class="shot" data-full="assets/gallery-1-full.jpg" aria-label="View gameplay image 1">
              <img src="assets/gallery-1.jpg" alt="Stage Fright screenshot of purple puzzle room">
            </button>
            <button class="shot" data-full="assets/gallery-2-full.jpg" aria-label="View gameplay image 2">
              <img src="assets/gallery-2.jpg" alt="Stage Fright screenshot of dark puzzle room">
            </button>
            <button class="shot" data-full="assets/gallery-3-full.jpg" aria-label="View gameplay image 3">
              <img src="assets/gallery-3.jpg" alt="Stage Fright screenshot of forest gameplay area">
            </button>
          </div>
          <div class="gallery-frame-line gallery-frame-line-bottom" aria-hidden="true"></div>
        </div>

        <div class="gameplay-scenery" aria-hidden="true"></div>
      </section>

      <section id="trailer" class="trailer">
        <div class="trailer-side-art trailer-side-left" aria-hidden="true"></div>
        <div class="trailer-side-art trailer-side-right" aria-hidden="true"></div>

        <div class="chip">OFFICIAL TRAILER</div>
        <h2>THE SHOW MUST GO ON</h2>
        <div class="accent"></div>

        <div class="video-shell">
          <video id="video" controls preload="metadata" playsinline poster="assets/trailer-poster.jpg">
            <source src="assets/stage-fright-trailer.mp4" type="video/mp4">
            Your browser does not support video playback.
          </video>
        </div>
      </section>

      <footer class="footer">
        <div class="studio">
          <a href="#home" class="studio-name" aria-label="Ghost Town Games — back to top">
            <img class="studio-emblem" src="assets/ghost-town-mark.svg" alt="">
            <span>GHOST TOWN<br>GAMES</span>
          </a>
          <small>© 2026 Ghost Town Games.<br>All Rights Reserved.</small>
        </div>

        <div class="foot-middle">
          <a href="#home" aria-label="Stage Fright — back to top"><img src="assets/logo.png" alt="Stage Fright"></a>
          <div class="social" aria-label="Social media">
            <a href="https://twitter.com/GhostTownGames" target="_blank" rel="noopener noreferrer" aria-label="X" title="X">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.3-8.4L1.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20Z"/></svg>
            </a>
            <a href="https://www.instagram.com/ghosttowngames/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.7" cy="6.5" r="1.2"/></svg>
            </a>
            <a href="https://www.facebook.com/search/top?q=Ghost%20Town%20Games" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.4V13h2.8v8h3.4Z"/></svg>
            </a>
          </div>
        </div>

        <nav class="footer-links" aria-label="Footer navigation">
          <a href="#home">Privacy Policy</a>
          <a href="#home">Terms of Service</a>
          <a href="#home">Support</a>
          <a href="#home">Press Kit</a>
        </nav>
      </footer>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded gameplay image" hidden>
    <button id="close" aria-label="Close image">×</button>
    <img id="expanded" alt="Expanded Stage Fright screenshot">
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="script.js"></script>
</body>
</html>
